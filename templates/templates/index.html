<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1> Simple Health Dashboard</h1>
            <p class="subtitle">Track your daily wellness</p>
        </header>

        <!-- Time & Weekend Info -->
        <div class="info-section">
            <div class="info-card">
                <h2>Current Time</h2>
                <p>{{ time }}</p>
            </div>
            
            <div class="info-card">
                <h2>Weekend Countdown</h2>
                {% if days_to_weekend == 0 %}
                    <p class="big-text">🎉</p>
                    <p>It's the weekend!</p>
                {% else %}
                    <p class="big-text">{{ days_to_weekend }}</p>
                    <p>days until weekend</p>
                {% endif %}
            </div>
        </div>

        <!-- TODO: Add form section here (see LAB_GUIDE.md Part 2) -->

        <!-- TODO: Add feedback section here (see LAB_GUIDE.md Part 4) -->

        <footer>
            <p>Built with Flask • CS 584 • Spring 2026</p>
        </footer>
    </div>
</body>

<!-- Health Data Form -->
<section class="form-section">
    <h2>Log Your Daily Health</h2>
    <form action="/submit" method="POST" class="health-form">
        <div class="form-group">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" value="{{ user_data.name | default('') }}" required>
        </div>

        <div class="form-group">
            <label for="sleep_hours">Hours of Sleep:</label>
            <input type="number" id="sleep_hours" name="sleep_hours" placeholder="7.5" step="0.5" value="{{ user_data.sleep_hours | default('') }}" required>
        </div>

        <div class="form-group">
            <label for="water_glasses">Glasses of Water:</label>
            <input type="number" id="water_glasses" name="water_glasses" placeholder="7.5" step="0.5" value="{{ user_data.water_glasses | default('') }}" required>
        </div>

        <div class="form-group">
            <label for="weekly_exercise_hours">Weekly Exercise (hours):</label>
            <input type="number" id="weekly_exercise_hours" name="weekly_exercise_hours" placeholder="3" step="0.5" min="0" value="{{ user_data.weekly_exercise_hours | default('') }}" required>
        </div>


        <button type="submit" class="submit-btn">Save</button>
    </form>
</section>


</html>
